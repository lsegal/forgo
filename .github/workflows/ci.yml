name: CI

on:
  push:
    branches: [release-branch.go1.27]
  pull_request:
    branches: [release-branch.go1.27]
  workflow_dispatch:

jobs:
  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package VS Code extension
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          npm install
          npx @vscode/vsce package --out /tmp/forgo-ci.vsix

  # The build-and-test matrix's macos-latest is Apple Silicon only, so this is
  # the only job that runs forgo on darwin/amd64 (for example the per-runtime
  # g TLS slot from #17). It is a separate job, not a matrix entry, so that it
  # has its own time limit and can be left out of required checks: a stuck
  # Intel queue must not block merges.
  #
  # macos-15-intel is GitHub's last Intel macOS image. GitHub stops supporting
  # x86_64 on macOS when the macOS 15 image is retired in fall 2027
  # (https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/).
  # Delete this job once the label is gone. The macos-13 queueing problem noted
  # in release.yml does not apply to this label.
  darwin-amd64-multiruntime:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Build forgo toolchain
        shell: bash
        run: |
          set -euo pipefail
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          cd src
          ./make.bash

      - name: Multi-runtime c-shared tests
        shell: bash
        run: |
          set -euo pipefail
          export GOROOT="$GITHUB_WORKSPACE"
          export GOTOOLCHAIN=local
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cp bin/forgo bin/go
          forgo test -count=1 -v -run TestMultiRuntime cmd/cgo/internal/testcshared

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only used to bootstrap-build the forgo toolchain; forgo is
      # self-hosting once built (src/go.mod requires Go 1.27, which per
      # go.dev/doc/install/source needs a Go 1.24.6+ bootstrap compiler).
      - name: Set up bootstrap Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.6"

      - name: Build forgo toolchain (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export GOROOT_BOOTSTRAP="$(go env GOROOT)"
          cd src
          ./make.bash

      - name: Build forgo toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOROOT_BOOTSTRAP = (go env GOROOT)
          Set-Location src
          & .\make.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The matrix above only builds linux/amd64, darwin/arm64 and
      # windows/amd64, so forgo-only runtime code that compiles there but not
      # on the other first-class ports would otherwise go unnoticed.
      - name: Cross-build std for other platforms
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export GOROOT="$GITHUB_WORKSPACE"
          export GOTOOLCHAIN=local
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          for target in linux/arm64 windows/arm64 darwin/amd64 linux/riscv64; do
            echo "=== $target ==="
            GOOS="${target%/*}" GOARCH="${target#*/}" forgo build std
          done

      - name: Run examples (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export GOROOT="$GITHUB_WORKSPACE"
          export GOTOOLCHAIN=local
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          status=0
          for dir in examples/*/; do
            name="$(basename "$dir")"
            # hotreload demonstrates `forgo run --watch`: its main() loops
            # forever by design, so a plain `forgo run` would never return.
            if [ "$name" = "hotreload" ]; then
              echo "=== $name (skipped: runs forever by design, see examples/hotreload/main.fgo) ==="
              continue
            fi
            echo "=== $name ==="
            if ! (cd "$dir" && forgo run .); then
              echo "!!! example $name failed"
              status=1
            fi
          done
          exit $status

      - name: Run examples (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOROOT = "$env:GITHUB_WORKSPACE"
          $env:GOTOOLCHAIN = "local"
          $env:PATH = "$env:GITHUB_WORKSPACE\bin;$env:PATH"
          $failed = $false
          Get-ChildItem examples -Directory | ForEach-Object {
            # hotreload demonstrates `forgo run --watch`: its main() loops
            # forever by design, so a plain `forgo run` would never return.
            if ($_.Name -eq "hotreload") {
              Write-Host "=== $($_.Name) (skipped: runs forever by design, see examples/hotreload/main.fgo) ==="
              return
            }
            Write-Host "=== $($_.Name) ==="
            Push-Location $_.FullName
            & forgo run .
            if ($LASTEXITCODE -ne 0) {
              Write-Host "!!! example $($_.Name) failed"
              $failed = $true
            }
            Pop-Location
          }
          if ($failed) { exit 1 }

      - name: Compiler unit tests (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export GOROOT="$GITHUB_WORKSPACE"
          export GOTOOLCHAIN=local
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          forgo test cmd/compile/internal/syntax/... cmd/compile/internal/forgo/...

      - name: Compiler unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOROOT = "$env:GITHUB_WORKSPACE"
          $env:GOTOOLCHAIN = "local"
          $env:PATH = "$env:GITHUB_WORKSPACE\bin;$env:PATH"
          forgo test cmd/compile/internal/syntax/... cmd/compile/internal/forgo/...

      # Several Go runtimes in one process (c-shared plugins). The cgo test
      # harness runs `go` from GOROOT/bin, so give it the forgo binary under
      # that name.
      - name: Multi-runtime c-shared tests (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export GOROOT="$GITHUB_WORKSPACE"
          export GOTOOLCHAIN=local
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          cp bin/forgo bin/go
          forgo test -count=1 -v -run TestMultiRuntime cmd/cgo/internal/testcshared

      - name: Multi-runtime c-shared tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:GOROOT = "$env:GITHUB_WORKSPACE"
          $env:GOTOOLCHAIN = "local"
          $env:PATH = "$env:GITHUB_WORKSPACE\bin;$env:PATH"
          Copy-Item bin\forgo.exe bin\go.exe
          forgo test -count=1 -v -run TestMultiRuntime cmd/cgo/internal/testcshared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The same multi-runtime cases in a real plugin host: pluginval
      # validates a VST3 module whose plugin classes run on three Go
      # runtimes in one process. See pluginval/README.md.
      - name: pluginval multi-runtime VST3 validation
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          ./pluginval/run.sh

      # Exercises the published install.{sh,ps1} release assets for real
      # against the latest release, so broken bootstrap URLs and installer
      # download/extract bugs fail CI instead of being discovered by a user.
      # Requires at least one prior release to exist, same as any real user
      # running these scripts would.
      #
      # Deliberately uses a trivial inline program, not examples/*, since
      # the latest *published* release may predate toolchain-only changes
      # on this branch (e.g. .fgo support) that the examples now rely on —
      # this step tests the installer, not this branch's newest features.
      - name: Test install script (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export FORGO_REPO=lsegal/forgo
          export FORGO_INSTALL_DIR="$RUNNER_TEMP/forgo-install-test"
          curl -fsSL "https://github.com/$FORGO_REPO/releases/latest/download/install.sh" -o "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh"
          "$FORGO_INSTALL_DIR/bin/forgo" version
          smoke="$RUNNER_TEMP/forgo-install-smoke"
          mkdir -p "$smoke"
          cat > "$smoke/main.go" <<'EOF'
          package main

          import "fmt"

          func main() { fmt.Println("ok") }
          EOF
          (cd "$smoke" && GOROOT="$FORGO_INSTALL_DIR" GOTOOLCHAIN=local GO111MODULE=off "$FORGO_INSTALL_DIR/bin/forgo" run .)

      - name: Test install script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:FORGO_REPO = "lsegal/forgo"
          $env:FORGO_INSTALL_DIR = "$env:RUNNER_TEMP\forgo-install-test"
          $installer = "$env:RUNNER_TEMP\install.ps1"
          Invoke-WebRequest "https://github.com/$env:FORGO_REPO/releases/latest/download/install.ps1" -OutFile $installer
          & $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:FORGO_INSTALL_DIR\bin\forgo.exe" version
          $smoke = "$env:RUNNER_TEMP\forgo-install-smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          @"
          package main

          import "fmt"

          func main() { fmt.Println("ok") }
          "@ | Set-Content -Path "$smoke\main.go"
          Push-Location $smoke
          $env:GOROOT = $env:FORGO_INSTALL_DIR
          $env:GOTOOLCHAIN = "local"
          $env:GO111MODULE = "off"
          & "$env:FORGO_INSTALL_DIR\bin\forgo.exe" run .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
